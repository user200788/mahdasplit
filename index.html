<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة التدريب الاحترافية - Powerlifting</title>
    <!-- خط Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --card-border: #262626;
            --primary-red: #dc2626;
            --red-hover: #b91c1c;
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px 10px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            transition: all 0.25s ease-in-out;
        }

        .tab-btn.active {
            background: var(--primary-red);
            color: #ffffff;
            border-color: var(--primary-red);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        /* Controls Bar for Weeks */
        .weeks-control-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .weeks-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-red) var(--card-bg);
            flex-grow: 1;
        }

        .weeks-scroll::-webkit-scrollbar { height: 4px; }
        .weeks-scroll::-webkit-scrollbar-thumb { background: var(--primary-red); border-radius: 4px; }

        .week-btn {
            min-width: 90px;
            background: #0a0a0a;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .week-btn.active {
            background: #220808;
            border-color: var(--primary-red);
            color: #ffffff;
            box-shadow: inset 0 0 8px rgba(220, 38, 38, 0.4);
        }

        .btn-add-week {
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
        }

        .btn-del-week {
            background: #262626;
            color: #ef4444;
            border: 1px solid #3f3f46;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            white-space: nowrap;
        }

        .days-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .page { display: none; }
        .page.active { display: block; }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
        }

        .day-card { border-right: 4px solid var(--primary-red); }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        h2 { font-size: 18px; font-weight: 800; color: #ffffff; }
        p.desc { color: var(--text-muted); font-size: 12px; margin-bottom: 15px; }

        /* Inputs & Buttons */
        label { display: block; margin-bottom: 4px; color: var(--text-muted); font-size: 11px; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: #0a0a0a;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--primary-red); }

        .btn-action {
            background: var(--primary-red);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
        }

        .btn-delete {
            background: #262626;
            color: #ef4444;
            border: 1px solid #3f3f46;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            width: 100%;
        }

        /* Mobile Table Grid */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid var(--card-border); padding: 8px; text-align: center; font-size: 12px; }
        th { background-color: #1c1c1c; color: var(--text-main); }

        .dual-inputs { display: flex; flex-direction: column; gap: 4px; }
        .set-label { font-size: 9px; color: var(--text-muted); display: block; }
        .calculated-val { font-weight: 800; color: #4ade80; font-size: 13px; }

        @media (max-width: 768px) {
            .mobile-grid-table thead { display: none; }
            .mobile-grid-table tbody tr {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                background: #111;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 12px;
                border: 1px solid var(--card-border);
            }
            .mobile-grid-table td {
                border: none;
                padding: 0;
                text-align: right;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .mobile-grid-table td::before {
                content: attr(data-label);
                font-size: 10px;
                color: var(--text-muted);
                font-weight: 700;
                margin-bottom: 2px;
            }
            .mobile-grid-table td.full-width { grid-column: span 2; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchPage(1, event)">الماكس والوزن</button>
        <button class="tab-btn" onclick="switchPage(2, event)">جدول التمارين الديناميكي</button>
    </div>

    <!-- الصفحة الأولى -->
    <div id="page1" class="page active">
        <div class="card">
            <h2>أقصى أوزان العدات (Max Reps)</h2>
            <p class="desc">تعديل الأرقام هنا يحدث أوزان التمارين المطلوبة فوراً:</p>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الرفعة</th>
                            <th style="color: var(--primary-red);">1RM</th>
                            <th>2RM</th>
                            <th>3RM</th>
                            <th>4RM</th>
                            <th>5RM</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>سكوات</strong></td>
                            <td><input type="number" id="squat_1" value="100" oninput="saveMaxReps('squat')"></td>
                            <td><input type="number" id="squat_2" value="95" oninput="saveMaxReps('squat')"></td>
                            <td><input type="number" id="squat_3" value="90" oninput="saveMaxReps('squat')"></td>
                            <td><input type="number" id="squat_4" value="85" oninput="saveMaxReps('squat')"></td>
                            <td><input type="number" id="squat_5" value="80" oninput="saveMaxReps('squat')"></td>
                        </tr>
                        <tr>
                            <td><strong>بنج بريس</strong></td>
                            <td><input type="number" id="bench_1" value="100" oninput="saveMaxReps('bench')"></td>
                            <td><input type="number" id="bench_2" value="95" oninput="saveMaxReps('bench')"></td>
                            <td><input type="number" id="bench_3" value="90" oninput="saveMaxReps('bench')"></td>
                            <td><input type="number" id="bench_4" value="85" oninput="saveMaxReps('bench')"></td>
                            <td><input type="number" id="bench_5" value="80" oninput="saveMaxReps('bench')"></td>
                        </tr>
                        <tr>
                            <td><strong>ديدليفت</strong></td>
                            <td><input type="number" id="deadlift_1" value="100" oninput="saveMaxReps('deadlift')"></td>
                            <td><input type="number" id="deadlift_2" value="95" oninput="saveMaxReps('deadlift')"></td>
                            <td><input type="number" id="deadlift_3" value="90" oninput="saveMaxReps('deadlift')"></td>
                            <td><input type="number" id="deadlift_4" value="85" oninput="saveMaxReps('deadlift')"></td>
                            <td><input type="number" id="deadlift_5" value="80" oninput="saveMaxReps('deadlift')"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>متابعة وزن الجسم اليومي</h2>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <div>
                    <label>التاريخ</label>
                    <input type="date" id="weightDate">
                </div>
                <div>
                    <label>الوزن (kg)</label>
                    <input type="number" step="0.1" id="dailyWeightInput" placeholder="75.0">
                </div>
                <button class="btn-action" style="height: 40px;" onclick="addDailyWeight()">حفظ الوزن</button>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>الوزن</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="weightHistoryTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- الصفحة الثانية -->
    <div id="page2" class="page">
        <!-- شريط التحكم بالأسابيع -->
        <div class="weeks-control-bar">
            <div class="weeks-scroll" id="weeksBar"></div>
            <button class="btn-add-week" onclick="addNewWeek()">+ أسبوع جديد</button>
            <button class="btn-del-week" onclick="deleteCurrentWeek()">حذف الأسبوع</button>
        </div>

        <!-- أزرار الأيام للأسبوع الحقيقي -->
        <div class="days-controls">
            <h3 id="currentWeekTitle" style="color: #fff; font-size: 16px;">الأسبوع 1</h3>
            <button class="btn-action" onclick="addNewDay()">+ إضافة يوم تدريبي</button>
        </div>

        <!-- الأيام الخاصة بالأسبوع المختار -->
        <div id="daysContainer"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://zkgkpguurqyizzbzxuzd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6PDUEqp0EgF1Cmd49WRhYA_2XTVocpi';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let weeksList = [];
    let currentWeek = 1;

    function switchPage(pageNum, event) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`page${pageNum}`).classList.add('active');
        event.target.classList.add('active');
    }

    // --- 1. إدارة الأسابيع الديناميكية ---
    async function loadWeeks() {
        const { data, error } = await _supabase.from('workout_weeks').select('*').order('week_num', { ascending: true });
        
        if (data && data.length > 0) {
            weeksList = data.map(w => w.week_num);
        } else {
            // إضافة الأسبوع 1 كافتراضي إذا لم تكن هناك أسابيع
            await _supabase.from('workout_weeks').insert([{ week_num: 1 }]);
            weeksList = [1];
        }
        
        if (!weeksList.includes(currentWeek)) {
            currentWeek = weeksList[0];
        }
        
        renderWeeksBar();
        loadDaysForWeek(currentWeek);
    }

    function renderWeeksBar() {
        const bar = document.getElementById('weeksBar');
        bar.innerHTML = '';
        weeksList.forEach(w => {
            bar.innerHTML += `
                <button class="week-btn ${w === currentWeek ? 'active' : ''}" id="week-btn-${w}" onclick="selectWeek(${w})">
                    📅 أسبوع ${w}
                </button>
            `;
        });
        document.getElementById('currentWeekTitle').innerText = `الأسبوع ${currentWeek}`;
    }

    async function addNewWeek() {
        const nextWeekNum = weeksList.length > 0 ? Math.max(...weeksList) + 1 : 1;
        const { error } = await _supabase.from('workout_weeks').insert([{ week_num: nextWeekNum }]);
        if (!error) {
            weeksList.push(nextWeekNum);
            selectWeek(nextWeekNum);
        }
    }

    async function deleteCurrentWeek() {
        if (weeksList.length <= 1) return alert("يجب إبقاء أسبوع واحد على الأقل!");
        if (!confirm(`هل أنت تأكد من حذف الأسبوع ${currentWeek} بجميع أيامه وتمارينه؟`)) return;

        await _supabase.from('workout_schedule').delete().eq('week_num', currentWeek);
        await _supabase.from('workout_weeks').delete().eq('week_num', currentWeek);

        weeksList = weeksList.filter(w => w !== currentWeek);
        currentWeek = weeksList[0];
        loadWeeks();
    }

    function selectWeek(weekNum) {
        currentWeek = weekNum;
        renderWeeksBar();
        loadDaysForWeek(currentWeek);
    }

    // --- 2. إدارة الأيام والتمرينات ---
    async function loadDaysForWeek(weekNum) {
        const container = document.getElementById('daysContainer');
        container.innerHTML = '';

        const { data } = await _supabase
            .from('workout_schedule')
            .select('*')
            .eq('week_num', weekNum)
            .order('day_num', { ascending: true });

        // تجميع الأيام المتاحة لهذا الأسبوع
        const dayNumbers = [...new Set(data ? data.map(i => i.day_num) : [])];
        
        // إذا كان أسبوع جديد بدون أيام، نبدأ باليوم 1 تلقائياً
        if (dayNumbers.length === 0) {
            renderDayCard(1);
        } else {
            dayNumbers.forEach(dNum => {
                renderDayCard(dNum);
                const dayItems = data.filter(i => i.day_num === dNum);
                dayItems.forEach(item => renderRow(dNum, item));
            });
        }
    }

    function renderDayCard(dayNum) {
        const container = document.getElementById('daysContainer');
        if (document.getElementById(`day-card-${dayNum}`)) return;

        const div = document.createElement('div');
        div.className = 'card day-card';
        div.id = `day-card-${dayNum}`;
        div.innerHTML = `
            <div class="day-header">
                <h2>اليوم ${dayNum}</h2>
                <div style="display:flex; gap: 8px;">
                    <button class="btn-action" onclick="addRow(${dayNum})">+ إضافة تمرين</button>
                    <button class="btn-delete" style="width:auto;" onclick="deleteDay(${dayNum})">حذف اليوم</button>
                </div>
            </div>
            <table class="mobile-grid-table">
                <thead>
                    <tr>
                        <th>التمرين</th>
                        <th>الرفعة</th>
                        <th>النظام</th>
                        <th>العدات/الجولات</th>
                        <th>النسبة %</th>
                        <th>RPE</th>
                        <th>الوزن</th>
                        <th>حذف</th>
                    </tr>
                </thead>
                <tbody id="day-${dayNum}-rows"></tbody>
            </table>
        `;
        container.appendChild(div);
    }

    async function addNewDay() {
        const existingDays = Array.from(document.querySelectorAll('.day-card')).map(card => parseInt(card.id.replace('day-card-', '')));
        const nextDayNum = existingDays.length > 0 ? Math.max(...existingDays) + 1 : 1;
        renderDayCard(nextDayNum);
    }

    async function deleteDay(dayNum) {
        if (!confirm(`هل أنت متاكد من حذف اليوم ${dayNum}؟`)) return;
        
        document.getElementById(`day-card-${dayNum}`)?.remove();
        await _supabase.from('workout_schedule')
            .delete()
            .eq('week_num', currentWeek)
            .eq('day_num', dayNum);
    }

    function addRow(dayNum) {
        const rowId = 'row_' + Date.now() + Math.random().toString(36).substr(2, 4);
        const rowData = { 
            id: rowId, 
            week_num: currentWeek, 
            day_num: dayNum, 
            exercise_name: '', 
            lift_type: 'none', 
            set_type: 'single', 
            reps: '', 
            pct: '', 
            rpe: '' 
        };
        renderRow(dayNum, rowData);
        saveRowToDb(rowId);
    }

    function renderRow(dayNum, item) {
        const tbody = document.getElementById(`day-${dayNum}-rows`);
        if (!tbody) return;

        const tr = document.createElement('tr');
        tr.id = item.id;
        tr.innerHTML = `
            <td data-label="اسم التمرين" class="full-width">
                <input type="text" class="ex-name" value="${item.exercise_name || ''}" placeholder="اسم التمرين" oninput="saveRowToDb('${item.id}')">
            </td>
            <td data-label="نوع الرفعة">
                <select class="lift-type" onchange="onLiftTypeChange('${item.id}')">
                    <option value="none" ${item.lift_type==='none'?'selected':''}>وزن حر</option>
                    <option value="squat" ${item.lift_type==='squat'?'selected':''}>سكوات</option>
                    <option value="bench" ${item.lift_type==='bench'?'selected':''}>بنج</option>
                    <option value="deadlift" ${item.lift_type==='deadlift'?'selected':''}>ديدليفت</option>
                </select>
            </td>
            <td data-label="نظام المجموعات">
                <select class="set-type" onchange="toggleSetType('${item.id}')">
                    <option value="single" ${item.set_type==='single'?'selected':''}>عادي</option>
                    <option value="top_back" ${item.set_type==='top_back'?'selected':''}>Top + Back</option>
                </select>
            </td>
            <td data-label="الستات والعدات" id="reps-container-${item.id}"></td>
            <td data-label="النسبة %" id="pct-container-${item.id}"></td>
            <td data-label="مقياس RPE" id="rpe-container-${item.id}"></td>
            <td data-label="الوزن المطلوب" id="weight-container-${item.id}"></td>
            <td data-label="" class="full-width" style="margin-top: 5px;">
                <button class="btn-delete" onclick="deleteRowFromDb('${item.id}')">إزالة التمرين</button>
            </td>
        `;
        tbody.appendChild(tr);
        toggleSetType(item.id, item);
    }

    function onLiftTypeChange(rowId) {
        calculateRowWeight(rowId);
        saveRowToDb(rowId);
    }

    function toggleSetType(rowId, savedData = null) {
        const row = document.getElementById(rowId);
        if (!row) return;

        const setType = row.querySelector('.set-type').value;

        const repsContainer = document.getElementById(`reps-container-${rowId}`);
        const pctContainer = document.getElementById(`pct-container-${rowId}`);
        const rpeContainer = document.getElementById(`rpe-container-${rowId}`);
        const weightContainer = document.getElementById(`weight-container-${rowId}`);

        let repsVal = savedData ? savedData.reps : '';
        let pctVal = savedData ? savedData.pct : '';
        let rpeVal = savedData ? savedData.rpe : '';

        if (setType === 'top_back') {
            const [rTop, rBack] = repsVal.split('|');
            const [pTop, pBack] = pctVal.split('|');
            const [rpTop, rpBack] = rpeVal.split('|');

            repsContainer.innerHTML = `
                <div class="dual-inputs">
                    <div><span class="set-label">Top:</span><input type="text" class="rep-top" value="${rTop||''}" placeholder="1x1" oninput="saveRowToDb('${rowId}')"></div>
                    <div><span class="set-label">Back:</span><input type="text" class="rep-back" value="${rBack||''}" placeholder="3x5" oninput="saveRowToDb('${rowId}')"></div>
                </div>`;
            pctContainer.innerHTML = `
                <div class="dual-inputs">
                    <input type="number" class="pct-top" value="${pTop||''}" placeholder="Top %" oninput="handleIntensityChange('${rowId}', 'pct')">
                    <input type="number" class="pct-back" value="${pBack||''}" placeholder="Back %" oninput="handleIntensityChange('${rowId}', 'pct')">
                </div>`;
            rpeContainer.innerHTML = `
                <div class="dual-inputs">
                    <input type="number" step="0.5" class="rpe-top" value="${rpTop||''}" placeholder="Top RPE" oninput="handleIntensityChange('${rowId}', 'rpe')">
                    <input type="number" step="0.5" class="rpe-back" value="${rpBack||''}" placeholder="Back RPE" oninput="handleIntensityChange('${rowId}', 'rpe')">
                </div>`;
            weightContainer.innerHTML = `
                <div class="dual-inputs">
                    <div><span class="set-label">Top:</span><span class="calculated-val weight-top">0 kg</span></div>
                    <div><span class="set-label">Back:</span><span class="calculated-val weight-back">0 kg</span></div>
                </div>`;
        } else {
            repsContainer.innerHTML = `<input type="text" class="rep-single" value="${repsVal}" placeholder="3x5" oninput="saveRowToDb('${rowId}')">`;
            pctContainer.innerHTML = `<input type="number" class="pct-input" value="${pctVal}" placeholder="75" oninput="handleIntensityChange('${rowId}', 'pct')">`;
            rpeContainer.innerHTML = `<input type="number" step="0.5" class="rpe-input" value="${rpeVal}" placeholder="@ 8" oninput="handleIntensityChange('${rowId}', 'rpe')">`;
            weightContainer.innerHTML = `<span class="calculated-val weight-result">0 kg</span>`;
        }

        handleIntensityChange(rowId, 'init');
    }

    function handleIntensityChange(rowId, source) {
        const row = document.getElementById(rowId);
        if (!row) return;

        const setType = row.querySelector('.set-type').value;

        if (setType === 'single') {
            const pct = row.querySelector('.pct-input');
            const rpe = row.querySelector('.rpe-input');
            if (pct && rpe) {
                if (source === 'pct' && pct.value !== '') rpe.style.display = 'none';
                else if (source === 'pct' && pct.value === '') rpe.style.display = 'block';
                if (source === 'rpe' && rpe.value !== '') pct.style.display = 'none';
                else if (source === 'rpe' && rpe.value === '') pct.style.display = 'block';
            }
        } else {
            const pctTop = row.querySelector('.pct-top'), pctBack = row.querySelector('.pct-back');
            const rpeTop = row.querySelector('.rpe-top'), rpeBack = row.querySelector('.rpe-back');
            if (pctTop && pctBack && rpeTop && rpeBack) {
                if (source === 'pct') {
                    rpeTop.style.display = pctTop.value !== '' ? 'none' : 'block';
                    rpeBack.style.display = pctBack.value !== '' ? 'none' : 'block';
                } else if (source === 'rpe') {
                    pctTop.style.display = rpeTop.value !== '' ? 'none' : 'block';
                    pctBack.style.display = rpeBack.value !== '' ? 'none' : 'block';
                }
            }
        }

        calculateRowWeight(rowId);
        if (source !== 'init') saveRowToDb(rowId);
    }

    function calculateRowWeight(rowId) {
        const row = document.getElementById(rowId);
        if (!row) return;

        const liftType = row.querySelector('.lift-type').value;
        const setType = row.querySelector('.set-type').value;

        let baseMax = 0;
        if (liftType === 'squat') baseMax = parseFloat(document.getElementById('squat_1').value) || 0;
        if (liftType === 'bench') baseMax = parseFloat(document.getElementById('bench_1').value) || 0;
        if (liftType === 'deadlift') baseMax = parseFloat(document.getElementById('deadlift_1').value) || 0;

        if (setType === 'single') {
            const pct = parseFloat(row.querySelector('.pct-input')?.value) || 0;
            const rpe = parseFloat(row.querySelector('.rpe-input')?.value) || 0;
            const res = row.querySelector('.weight-result');

            if (!res) return;

            if (pct > 0 && liftType !== 'none' && baseMax > 0) {
                res.innerText = `${(baseMax * (pct / 100)).toFixed(1)} kg`;
                res.style.color = '#4ade80';
            } else if (rpe > 0) {
                res.innerText = `@ RPE ${rpe}`;
                res.style.color = '#f59e0b';
            } else {
                res.innerText = 'حسب الشعور';
                res.style.color = 'var(--text-muted)';
            }
        } else {
            const pctTop = parseFloat(row.querySelector('.pct-top')?.value) || 0;
            const pctBack = parseFloat(row.querySelector('.pct-back')?.value) || 0;
            const rpeTop = parseFloat(row.querySelector('.rpe-top')?.value) || 0;
            const rpeBack = parseFloat(row.querySelector('.rpe-back')?.value) || 0;

            const resTop = row.querySelector('.weight-top');
            const resBack = row.querySelector('.weight-back');

            if (!resTop || !resBack) return;

            let topWeightVal = 0;
            if (pctTop > 0 && liftType !== 'none' && baseMax > 0) {
                topWeightVal = baseMax * (pctTop / 100);
                resTop.innerText = `${topWeightVal.toFixed(1)} kg`;
                resTop.style.color = '#4ade80';
            } else if (rpeTop > 0) {
                resTop.innerText = `@ RPE ${rpeTop}`;
                resTop.style.color = '#f59e0b';
            } else {
                resTop.innerText = 'حر';
                resTop.style.color = 'var(--text-muted)';
            }

            if (pctBack > 0 && topWeightVal > 0) {
                const backWeightVal = topWeightVal * (pctBack / 100);
                resBack.innerText = `${backWeightVal.toFixed(1)} kg`;
                resBack.style.color = '#4ade80';
            } else if (rpeBack > 0) {
                resBack.innerText = `@ RPE ${rpeBack}`;
                resBack.style.color = '#f59e0b';
            } else {
                resBack.innerText = 'حر';
                resBack.style.color = 'var(--text-muted)';
            }
        }
    }

    let saveRowTimers = {};
    function saveRowToDb(rowId) {
        clearTimeout(saveRowTimers[rowId]);
        saveRowTimers[rowId] = setTimeout(async () => {
            const row = document.getElementById(rowId);
            if (!row) return;

            const dayCard = row.closest('.day-card');
            const dayNum = parseInt(dayCard.id.replace('day-card-', ''));
            const setType = row.querySelector('.set-type').value;

            let repsStr = '', pctStr = '', rpeStr = '';

            if (setType === 'single') {
                repsStr = row.querySelector('.rep-single')?.value || '';
                pctStr = row.querySelector('.pct-input')?.value || '';
                rpeStr = row.querySelector('.rpe-input')?.value || '';
            } else {
                repsStr = `${row.querySelector('.rep-top')?.value || ''}|${row.querySelector('.rep-back')?.value || ''}`;
                pctStr = `${row.querySelector('.pct-top')?.value || ''}|${row.querySelector('.pct-back')?.value || ''}`;
                rpeStr = `${row.querySelector('.rpe-top')?.value || ''}|${row.querySelector('.rpe-back')?.value || ''}`;
            }

            const dataPayload = {
                id: rowId,
                week_num: currentWeek,
                day_num: dayNum,
                exercise_name: row.querySelector('.ex-name')?.value || '',
                lift_type: row.querySelector('.lift-type')?.value || 'none',
                set_type: setType,
                reps: repsStr,
                pct: pctStr,
                rpe: rpeStr
            };

            await _supabase.from('workout_schedule').upsert([dataPayload]);
        }, 400);
    }

    async function deleteRowFromDb(rowId) {
        document.getElementById(rowId)?.remove();
        await _supabase.from('workout_schedule').delete().eq('id', rowId);
    }

    // --- 3. أقصى الأوزان والوزن اليومي ---
    async function loadMaxReps() {
        try {
            const { data } = await _supabase.from('max_reps').select('*');
            if (data && data.length > 0) {
                data.forEach(row => {
                    for (let i = 1; i <= 5; i++) {
                        const el = document.getElementById(`${row.lift}_${i}`);
                        if (el && row[`rep${i}`] !== undefined) el.value = row[`rep${i}`];
                    }
                });
            }
        } catch (e) {
            console.error(e);
        } finally {
            updateAllCalculations();
        }
    }

    let maxRepsTimer = null;
    function saveMaxReps(lift) {
        updateAllCalculations();
        clearTimeout(maxRepsTimer);
        maxRepsTimer = setTimeout(async () => {
            const rowData = {
                lift: lift,
                rep1: parseFloat(document.getElementById(`${lift}_1`).value) || 0,
                rep2: parseFloat(document.getElementById(`${lift}_2`).value) || 0,
                rep3: parseFloat(document.getElementById(`${lift}_3`).value) || 0,
                rep4: parseFloat(document.getElementById(`${lift}_4`).value) || 0,
                rep5: parseFloat(document.getElementById(`${lift}_5`).value) || 0
            };
            await _supabase.from('max_reps').upsert([rowData], { onConflict: 'lift' });
        }, 500);
    }

    async function loadBodyWeight() {
        const { data } = await _supabase.from('body_weight').select('*').order('date', { ascending: false });
        const tbody = document.getElementById('weightHistoryTable');
        tbody.innerHTML = '';
        if (data) {
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.date}</td>
                        <td><strong>${item.weight} kg</strong></td>
                        <td><button class="btn-delete" onclick="deleteWeight(${item.id})">حذف</button></td>
                    </tr>`;
            });
        }
    }

    async function addDailyWeight() {
        const date = document.getElementById('weightDate').value;
        const weight = parseFloat(document.getElementById('dailyWeightInput').value);

        if (!date || !weight) return alert('الرجاء كتابة الوزن والتاريخ');

        const { error } = await _supabase.from('body_weight').insert([{ date, weight }]);
        if (!error) {
            document.getElementById('dailyWeightInput').value = '';
            loadBodyWeight();
        }
    }

    async function deleteWeight(id) {
        const { error } = await _supabase.from('body_weight').delete().eq('id', id);
        if (!error) loadBodyWeight();
    }

    function updateAllCalculations() {
        document.querySelectorAll('tr[id^="row_"]').forEach(tr => calculateRowWeight(tr.id));
    }

    window.onload = async function() {
        document.getElementById('weightDate').valueAsDate = new Date();
        await loadMaxReps();
        await loadBodyWeight();
        await loadWeeks();
    };
</script>
